name: SDK checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/aix-js/package-lock.json
      - run: npm ci
        working-directory: packages/aix-js
      - run: npm test && npm run typecheck && npm run build
        working-directory: packages/aix-js
      - run: node --test test/connection-probe.test.mjs
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './packages/aix-python[test]'
      - run: python -m pytest packages/aix-python
  packages:
    needs: [javascript, python]
    uses: ./.github/workflows/verify-release.yml
    with:
      version: '0.1.1'
